# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# MYSQL (XAMPP)
# ===============================
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/bdcomptax?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===============================
# JWT CONFIG (IMPORTANT FIX FOR YOUR ERROR)
# ===============================
jwt.secret=mySuperSecretKey2026
jwt.expiration=86400000

# ===============================
# OPTIONAL (avoids some lazy loading issues in APIs)
# ===============================
spring.jpa.open-in-view=false